version: '3.8'
services:
  postgres:
    image: postgres:latest
    container_name: postgres0702
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - postgres_data1:/var/lib/postgresql/data
  redis:
    image: redis
    container_name: redis0702
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data1: 
  redis_data: